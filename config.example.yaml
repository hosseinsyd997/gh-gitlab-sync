github:
  token: "ghp_xxx"                # repo scope (add push scope only if push_new_branches: true)
  api: "https://api.github.com"

gitlab:
  url: "http://127.0.0.1"         # or https://192.168.100.180 if that's what your server needs
  token: "glpat-xxx"              # Personal/Project Access Token, scope: api

sync:
  state_db: "/opt/gh-gitlab-sync/state.db"   # absolute path — don't use a relative "./state.db"
  marker_prefix: "gh-gitlab-sync"  # used inside the hidden HTML marker, don't change after first run
  push_new_branches: false         # see README "MR/PR branch caveat" before enabling
  sync_prs_mrs: true
  sync_comments: true
  poll_window_safety_minutes: 10

# Only mehrdevteam org repos are mirrored to GitLab — personal account repos have no
# GitLab counterpart at all, so they're intentionally NOT listed here. Keep this list in
# sync with the "Active projects" table in the Obsidian vault's
# Infra/GitHub-Projects-Map.md — add a pair here only when a new project is confirmed
# mirrored on GitLab.
